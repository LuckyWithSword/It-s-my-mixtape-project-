<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="tapeBodyM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="labelGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="shadowM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full bleed background for Android launcher masking -->
  <rect width="512" height="512" fill="url(#maskBg)"/>

  <!-- Centered safe zone Cassette (within 380x240 inside 512x512) -->
  <g filter="url(#shadowM)">
    <rect x="76" y="146" width="360" height="220" rx="16" fill="url(#tapeBodyM)"/>
    <rect x="82" y="152" width="348" height="208" rx="12" fill="none" stroke="#FFA726" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Screws in 4 corners -->
    <circle cx="94" cy="164" r="4.5" fill="#D7CCC8"/>
    <circle cx="418" cy="164" r="4.5" fill="#D7CCC8"/>
    <circle cx="94" cy="348" r="4.5" fill="#D7CCC8"/>
    <circle cx="418" cy="348" r="4.5" fill="#D7CCC8"/>

    <!-- Cassette Label Area -->
    <rect x="110" y="170" width="292" height="125" rx="8" fill="url(#labelGradM)"/>
    
    <!-- Top Label Header stripes -->
    <rect x="122" y="180" width="268" height="6.5" rx="3" fill="#FF5722"/>
    <rect x="122" y="190" width="268" height="2.5" rx="1" fill="#FFA726"/>

    <text x="126" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#1E1E1E" letter-spacing="1.5">IT'S MY PLAYLIST</text>
    <text x="372" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FF5722" text-anchor="end">SIDE A</text>

    <!-- Center Window -->
    <rect x="162" y="220" width="188" height="64" rx="7" fill="#262626"/>
    <rect x="166" y="224" width="180" height="56" rx="5" fill="#171717"/>

    <!-- Transparent tape window bridge -->
    <rect x="218" y="230" width="76" height="44" rx="4" fill="#383838" fill-opacity="0.9"/>
    <!-- Tape bridge markings -->
    <line x1="256" y1="234" x2="256" y2="270" stroke="#FF5722" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Left Reel Hub -->
    <circle cx="200" cy="252" r="19" fill="#FFFFFF"/>
    <circle cx="200" cy="252" r="12" fill="#171717"/>
    <circle cx="200" cy="252" r="6" fill="#FFFFFF"/>
    <!-- Reel teeth -->
    <rect x="198" y="235" width="4" height="5" fill="#FFFFFF"/>
    <rect x="198" y="264" width="4" height="5" fill="#FFFFFF"/>
    <rect x="183" y="250" width="5" height="4" fill="#FFFFFF"/>
    <rect x="212" y="250" width="5" height="4" fill="#FFFFFF"/>

    <!-- Right Reel Hub -->
    <circle cx="312" cy="252" r="19" fill="#FFFFFF"/>
    <circle cx="312" cy="252" r="12" fill="#171717"/>
    <circle cx="312" cy="252" r="6" fill="#FFFFFF"/>
    <!-- Reel teeth -->
    <rect x="310" y="235" width="4" height="5" fill="#FFFFFF"/>
    <rect x="310" y="264" width="4" height="5" fill="#FFFFFF"/>
    <rect x="295" y="250" width="5" height="4" fill="#FFFFFF"/>
    <rect x="324" y="250" width="5" height="4" fill="#FFFFFF"/>

    <!-- Bottom Trapezoid Head Area -->
    <polygon points="138,366 166,316 346,316 374,366" fill="#BF360C"/>
    <circle cx="220" cy="340" r="5" fill="#3E2723"/>
    <circle cx="292" cy="340" r="5" fill="#3E2723"/>
    <rect x="242" y="328" width="28" height="20" rx="3" fill="#D7CCC8"/>
  </g>
</svg>
