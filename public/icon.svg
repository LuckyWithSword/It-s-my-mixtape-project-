<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="tapeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Cassette Body -->
  <g filter="url(#shadow)">
    <rect x="56" y="106" width="400" height="260" rx="20" fill="url(#tapeBody)"/>
    <rect x="62" y="112" width="388" height="248" rx="16" fill="none" stroke="#FFA726" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Screws in 4 corners -->
    <circle cx="76" cy="126" r="5" fill="#D7CCC8"/>
    <circle cx="436" cy="126" r="5" fill="#D7CCC8"/>
    <circle cx="76" cy="346" r="5" fill="#D7CCC8"/>
    <circle cx="436" cy="346" r="5" fill="#D7CCC8"/>

    <!-- Cassette Label Area -->
    <rect x="96" y="136" width="320" height="150" rx="10" fill="url(#labelGrad)"/>
    
    <!-- Top Label Header stripes -->
    <rect x="110" y="148" width="292" height="8" rx="4" fill="#FF5722"/>
    <rect x="110" y="160" width="292" height="3" rx="1.5" fill="#FFA726"/>

    <text x="116" y="186" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#1E1E1E" letter-spacing="2">IT'S MY PLAYLIST</text>
    <text x="382" y="186" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#FF5722" text-anchor="end">SIDE A</text>

    <!-- Center Window -->
    <rect x="156" y="198" width="200" height="74" rx="8" fill="#262626"/>
    <rect x="160" y="202" width="192" height="66" rx="6" fill="#171717"/>

    <!-- Transparent tape window bridge -->
    <rect x="216" y="210" width="80" height="50" rx="4" fill="#383838" fill-opacity="0.9"/>
    <!-- Tape bridge markings -->
    <line x1="256" y1="216" x2="256" y2="254" stroke="#FF5722" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Left Reel Hub -->
    <circle cx="196" cy="235" r="22" fill="#FFFFFF"/>
    <circle cx="196" cy="235" r="14" fill="#171717"/>
    <circle cx="196" cy="235" r="7" fill="#FFFFFF"/>
    <!-- Reel teeth -->
    <rect x="194" y="215" width="4" height="6" fill="#FFFFFF"/>
    <rect x="194" y="249" width="4" height="6" fill="#FFFFFF"/>
    <rect x="176" y="233" width="6" height="4" fill="#FFFFFF"/>
    <rect x="210" y="233" width="6" height="4" fill="#FFFFFF"/>

    <!-- Right Reel Hub -->
    <circle cx="316" cy="235" r="22" fill="#FFFFFF"/>
    <circle cx="316" cy="235" r="14" fill="#171717"/>
    <circle cx="316" cy="235" r="7" fill="#FFFFFF"/>
    <!-- Reel teeth -->
    <rect x="314" y="215" width="4" height="6" fill="#FFFFFF"/>
    <rect x="314" y="249" width="4" height="6" fill="#FFFFFF"/>
    <rect x="296" y="233" width="6" height="4" fill="#FFFFFF"/>
    <rect x="330" y="233" width="6" height="4" fill="#FFFFFF"/>

    <!-- Bottom Trapezoid Head Area -->
    <polygon points="126,366 156,310 356,310 386,366" fill="#BF360C"/>
    <circle cx="216" cy="336" r="6" fill="#3E2723"/>
    <circle cx="296" cy="336" r="6" fill="#3E2723"/>
    <rect x="240" y="324" width="32" height="24" rx="3" fill="#D7CCC8"/>
  </g>
</svg>
